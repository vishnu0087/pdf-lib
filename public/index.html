<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PDF generator</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f4f2ef;
        --card: #fff;
        --border: #e2ddd6;
        --text: #1a1a1a;
        --muted: #6b6560;
        --accent: #c45c26;
        --accent-dim: #e8d5cc;
        --danger: #b00020;
        --ok: #2e7d32;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
      }
      .wrap {
        max-width: 22rem;
        margin: 0 auto;
        padding: 2rem 1.1rem 2.5rem;
      }
      h1 {
        font-size: 1.25rem;
        font-weight: 640;
        margin: 0 0 1rem;
        letter-spacing: -0.02em;
      }
      .steps {
        display: flex;
        gap: 0.35rem;
        margin-bottom: 1rem;
        font-size: 0.72rem;
        color: var(--muted);
      }
      .steps span {
        padding: 0.15rem 0.45rem;
        border-radius: 999px;
        background: var(--border);
      }
      .steps span.on {
        background: var(--accent);
        color: #fff;
      }
      .panel {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 11px;
        padding: 1.15rem 1rem;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.04);
      }
      fieldset {
        border: none;
        margin: 0;
        padding: 0;
      }
      legend {
        font-weight: 600;
        font-size: 0.88rem;
        margin-bottom: 0.65rem;
      }
      .opts {
        display: grid;
        gap: 0.4rem;
      }
      .opt {
        display: flex;
        align-items: center;
        gap: 0.55rem;
        padding: 0.5rem 0.7rem;
        border: 1px solid var(--border);
        border-radius: 7px;
        cursor: pointer;
      }
      .opt:hover {
        border-color: #c4bcb2;
      }
      .opt:has(input:checked) {
        border-color: var(--accent);
        background: var(--accent-dim);
      }
      .opt input {
        accent-color: var(--accent);
      }
      .row {
        display: flex;
        gap: 0.5rem;
        margin-top: 1rem;
      }
      .row.flex-end {
        justify-content: flex-end;
      }
      button {
        font: inherit;
        padding: 0.48rem 0.95rem;
        border-radius: 7px;
        border: none;
        cursor: pointer;
        font-weight: 600;
        font-size: 0.86rem;
      }
      button.primary {
        background: var(--accent);
        color: #fff;
      }
      button.primary:disabled {
        opacity: 0.42;
        cursor: not-allowed;
      }
      button.ghost {
        background: transparent;
        color: var(--muted);
        border: 1px solid var(--border);
      }
      button.mini {
        font-weight: 500;
        padding: 0.35rem 0.5rem;
        font-size: 0.82rem;
        background: transparent;
        color: var(--muted);
        border: none;
        text-decoration: underline;
      }
      .drop {
        border: 2px dashed var(--border);
        border-radius: 9px;
        padding: 1.1rem 0.85rem;
        text-align: center;
        font-size: 0.82rem;
        color: var(--muted);
      }
      .drop input[type='file'] {
        margin-top: 0.55rem;
        max-width: 100%;
        font-size: 0.78rem;
      }
      .msg {
        margin-top: 0.75rem;
        padding: 0.5rem 0.65rem;
        border-radius: 7px;
        font-size: 0.82rem;
      }
      .msg.err {
        background: #ffebee;
        color: var(--danger);
      }
      .template-option-row {
        display: flex;
        align-items: center;
        gap: 0.4rem;
        flex-wrap: wrap;
      }
      .template-option-row .opt--grow {
        flex: 1;
        min-width: 0;
      }
      button.btn-inline {
        padding: 0.3rem 0.55rem;
        font-size: 0.76rem;
        font-weight: 600;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: var(--card);
        color: var(--text);
        flex-shrink: 0;
      }
      button.btn-inline.danger {
        color: var(--danger);
        border-color: #ffcdd2;
      }
      .msg.ok {
        background: #e8f5e9;
        color: var(--ok);
      }
      .hidden {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>PDF</h1>
      <div class="steps" aria-hidden="true">
        <span class="on" data-step="1">1</span>
        <span data-step="2">2</span>
        <span data-step="3">3</span>
      </div>

      <div class="panel">
        <section id="step-1" class="step">
          <fieldset>
            <legend>Type</legend>
            <div class="opts">
              <label class="opt">
                <input type="radio" name="docType" value="quote" />
                Quote
              </label>
              <label class="opt">
                <input type="radio" name="docType" value="invoice" />
                Invoice
              </label>
              <label class="opt">
                <input type="radio" name="docType" value="salary" />
                Salary
              </label>
              <label class="opt">
                <input type="radio" name="docType" value="sales" />
                Sales
              </label>
            </div>
          </fieldset>
          <div class="row flex-end">
            <button type="button" class="primary" id="btn-next-1" disabled>
              Next
            </button>
          </div>
        </section>

        <section id="step-2" class="step hidden">
          <fieldset>
            <legend>Data</legend>
            <div class="drop">
              JSON
              <input
                type="file"
                id="json-file"
                accept=".json,application/json"
              />
            </div>
          </fieldset>
          <div id="step2-msg"></div>
          <div class="row">
            <button type="button" class="ghost" id="btn-back-2">Back</button>
            <button type="button" class="primary" id="btn-next-2" disabled>
              Next
            </button>
          </div>
        </section>

        <section id="step-3" class="step hidden">
          <fieldset>
            <legend>Template</legend>
            <div id="template-radio-group" class="opts"></div>
          </fieldset>
          <div class="row" style="margin-top: 0.35rem">
            <button type="button" class="mini" id="btn-customize">
              Edit layout…
            </button>
          </div>
          <p style="font-size: 0.78rem; color: var(--muted); margin: 0.35rem 0 0">
            Customize opens a full-page sample PDF (fixture data for your document type).
            Your uploaded JSON is still used when you download.
          </p>
          <div id="step3-msg"></div>
          <div class="row">
            <button type="button" class="ghost" id="btn-back-3">Back</button>
            <button type="button" class="primary" id="btn-download">
              Download
            </button>
          </div>
        </section>
      </div>
    </div>

    <script>
      const state = {
        step: 1,
        docType: null,
        data: null,
        templatePick: 'default',
      };

      let uploadedForDocType = null;

      function pdfEditorFingerprint() {
        return `${state.docType || ''}-${JSON.stringify(state.data ?? {}).slice(0, 80)}-${(state.data &&
          state.data.format) ||
          ''}`;
      }

      function clearEditorStorage() {
        try {
          localStorage.removeItem('pdfEditorLiveHtml');
          localStorage.removeItem('pdfEditorLiveDocType');
          localStorage.removeItem('pdfEditorFingerprint');
          localStorage.removeItem('pdfTemplateEditorBootstrap');
        } catch (_) {}
      }

      const $ = (id) => document.getElementById(id);
      const stepEls = [$('step-1'), $('step-2'), $('step-3')];
      const indicatorSpans = document.querySelectorAll('.steps span');

      function showStep(n) {
        state.step = n;
        stepEls.forEach((el, i) => {
          el.classList.toggle('hidden', i + 1 !== n);
        });
        indicatorSpans.forEach((span) => {
          span.classList.toggle('on', span.dataset.step === String(n));
        });
        if (n === 3 && state.docType) rebuildTemplateRadios();
      }

      function sanitizeClientLiveHtml(html) {
        return String(html)
          .replace(/<script\b[\s\S]*?<\/script>/gi, '')
          .replace(/<iframe\b[\s\S]*?<\/iframe>/gi, '');
      }

      function isUsableLiveHtmlSnapshot(s) {
        return (
          typeof s === 'string' &&
          s.length > 400 &&
          /<html[\s>]/i.test(s) &&
          /<\/html>/i.test(s)
        );
      }

      function liveHtmlFromEditorTab() {
        const fp = localStorage.getItem('pdfEditorFingerprint');
        const doc = localStorage.getItem('pdfEditorLiveDocType');
        const raw = localStorage.getItem('pdfEditorLiveHtml');
        if (
          !raw ||
          doc !== state.docType ||
          fp !== pdfEditorFingerprint() ||
          !isUsableLiveHtmlSnapshot(raw)
        )
          return '';
        return sanitizeClientLiveHtml(raw);
      }

      async function rebuildTemplateRadios() {
        const doc = state.docType;
        const box = $('template-radio-group');
        if (!doc || !box) return;

        let list = [];
        try {
          const res = await fetch(
            `/api/custom-templates?docType=${encodeURIComponent(doc)}`
          );
          list = await res.json();
          if (!res.ok || !Array.isArray(list)) list = [];
        } catch {
          list = [];
        }

        if (
          state.templatePick !== 'default' &&
          !list.some((x) => x.id === state.templatePick)
        ) {
          state.templatePick = 'default';
        }

        box.innerHTML = '';

        const defLbl = document.createElement('label');
        defLbl.className = 'opt';
        const defInp = document.createElement('input');
        defInp.type = 'radio';
        defInp.name = 'templatePick';
        defInp.value = 'default';
        defLbl.appendChild(defInp);
        defLbl.appendChild(document.createTextNode(' Default'));
        box.appendChild(defLbl);

        for (const t of list) {
          const row = document.createElement('div');
          row.className = 'template-option-row';

          const lbl = document.createElement('label');
          lbl.className = 'opt opt--grow';
          const inp = document.createElement('input');
          inp.type = 'radio';
          inp.name = 'templatePick';
          inp.value = t.id;
          lbl.appendChild(inp);
          lbl.appendChild(
            document.createTextNode(' ' + String(t.name || t.id))
          );

          const editBtn = document.createElement('button');
          editBtn.type = 'button';
          editBtn.className = 'btn-inline ghost';
          editBtn.textContent = 'Edit';
          editBtn.addEventListener('click', (ev) => {
            ev.preventDefault();
            ev.stopPropagation();
            try {
              localStorage.setItem(
                'pdfTemplateEditorBootstrap',
                JSON.stringify({
                  docType: state.docType,
                  templatePick: t.id,
                })
              );
            } catch {
              setMsg('step3-msg', 'Storage failed.', 'err');
              return;
            }
            window.open('/template-editor/', '_blank', 'noopener');
          });

          const delBtn = document.createElement('button');
          delBtn.type = 'button';
          delBtn.className = 'btn-inline danger';
          delBtn.textContent = 'Delete';
          delBtn.addEventListener('click', async (ev) => {
            ev.preventDefault();
            ev.stopPropagation();
            if (
              !confirm(
                'Delete template "' + String(t.name || t.id) + '"?'
              )
            )
              return;
            try {
              const res = await fetch(
                `/api/custom-templates/${encodeURIComponent(t.id)}?docType=${encodeURIComponent(state.docType)}`,
                { method: 'DELETE' }
              );
              const jr = await res.json().catch(() => ({}));
              if (!res.ok) {
                setMsg('step3-msg', jr.error || 'Delete failed.', 'err');
                return;
              }
              clearMsg('step3-msg');
              if (state.templatePick === t.id) state.templatePick = 'default';
              await rebuildTemplateRadios();
            } catch {
              setMsg('step3-msg', 'Delete failed.', 'err');
            }
          });

          row.appendChild(lbl);
          row.appendChild(editBtn);
          row.appendChild(delBtn);
          box.appendChild(row);
        }

        Array.from(box.querySelectorAll('input[name="templatePick"]')).forEach(
          (el) => {
            el.checked = el.value === state.templatePick;
          }
        );
      }

      $('step-3').addEventListener('change', (ev) => {
        const el = ev.target;
        if (el && el.name === 'templatePick')
          state.templatePick = /** @type {HTMLInputElement} */ (el).value;
      });

      function clearMsg(id) {
        const el = $(id);
        el.innerHTML = '';
        el.className = '';
      }

      function setMsg(id, text, kind) {
        const el = $(id);
        el.textContent = text;
        el.className = 'msg ' + (kind || '');
      }

      document.querySelectorAll('input[name="docType"]').forEach((input) => {
        input.addEventListener('change', () => {
          $('btn-next-1').disabled = !document.querySelector(
            'input[name="docType"]:checked'
          );
        });
      });

      $('btn-next-1').addEventListener('click', () => {
        const sel = document.querySelector('input[name="docType"]:checked');
        if (!sel) return;
        const nextType = sel.value;
        if (uploadedForDocType !== nextType) {
          state.data = null;
          uploadedForDocType = null;
          $('json-file').value = '';
          $('btn-next-2').disabled = true;
          clearMsg('step2-msg');
        }
        state.docType = nextType;
        state.templatePick = 'default';
        clearEditorStorage();
        showStep(2);
      });

      $('btn-back-2').addEventListener('click', () => {
        clearMsg('step2-msg');
        showStep(1);
      });

      $('btn-back-3').addEventListener('click', () => {
        clearMsg('step3-msg');
        showStep(2);
      });

      async function validateWithServer(data) {
        const res = await fetch('/api/validate-pdf-json', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ docType: state.docType, data }),
        });
        const body = await res.json().catch(() => ({}));
        if (!res.ok) {
          return {
            ok: false,
            error: body.error || res.statusText || 'Invalid',
          };
        }
        return { ok: true };
      }

      $('json-file').addEventListener('change', async (ev) => {
        $('btn-next-2').disabled = true;
        state.data = null;
        clearEditorStorage();
        clearMsg('step2-msg');
        const file = ev.target.files && ev.target.files[0];
        if (!file) return;

        if (file.size === 0) {
          setMsg('step2-msg', 'Empty file.', 'err');
          return;
        }

        let text;
        try {
          text = await file.text();
        } catch {
          setMsg('step2-msg', 'Read failed.', 'err');
          return;
        }

        if (!text.trim()) {
          setMsg('step2-msg', 'Not JSON.', 'err');
          return;
        }

        let data;
        try {
          data = JSON.parse(text);
        } catch (e) {
          setMsg('step2-msg', 'Bad JSON.', 'err');
          return;
        }

        if (data === null || typeof data !== 'object' || Array.isArray(data)) {
          setMsg('step2-msg', 'Need object root.', 'err');
          return;
        }

        const v = await validateWithServer(data);
        if (!v.ok) {
          setMsg('step2-msg', v.error, 'err');
          return;
        }

        state.data = data;
        uploadedForDocType = state.docType;
        setMsg('step2-msg', 'OK', 'ok');
        $('btn-next-2').disabled = false;
      });

      $('btn-next-2').addEventListener('click', () => {
        if (!state.data) return;
        clearMsg('step2-msg');
        showStep(3);
      });

      $('btn-customize').addEventListener('click', () => {
        clearMsg('step3-msg');
        if (!state.docType) {
          setMsg('step3-msg', 'Pick a document type first.', 'err');
          return;
        }
        const sel = document.querySelector(
          'input[name="templatePick"]:checked'
        );
        const pick = sel ? sel.value : 'default';
        try {
          localStorage.setItem(
            'pdfTemplateEditorBootstrap',
            JSON.stringify({
              docType: state.docType,
              templatePick: pick,
            })
          );
        } catch {
          setMsg('step3-msg', 'Storage failed.', 'err');
          return;
        }
        window.open('/template-editor/', '_blank', 'noopener');
      });

      window.addEventListener('message', async (ev) => {
        if (!ev.data || ev.data.type !== 'pdf-template-saved') return;
        if (ev.data.id) state.templatePick = ev.data.id;
        await rebuildTemplateRadios();
      });

      async function downloadPdf() {
        clearMsg('step3-msg');
        const btn = $('btn-download');
        btn.disabled = true;
        try {
          const liveHtml = liveHtmlFromEditorTab();
          const res = await fetch('/api/pdf-generate', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              docType: state.docType,
              data: state.data,
              templateId:
                state.templatePick && state.templatePick !== 'default'
                  ? state.templatePick
                  : undefined,
              ...(liveHtml ? { liveHtml } : {}),
            }),
          });
          if (!res.ok) {
            const err = await res.json().catch(() => ({}));
            setMsg('step3-msg', err.error || 'Failed.', 'err');
            return;
          }
          const blob = await res.blob();
          const cd = res.headers.get('Content-Disposition');
          let name = 'document.pdf';
          if (cd) {
            const m = /filename="([^"]+)"/.exec(cd);
            if (m) name = m[1];
          }
          const href = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = href;
          a.download = name;
          a.click();
          URL.revokeObjectURL(href);
        } catch (e) {
          setMsg('step3-msg', String(e.message || e), 'err');
        } finally {
          btn.disabled = false;
        }
      }

      $('btn-download').addEventListener('click', downloadPdf);
    </script>
  </body>
</html>
