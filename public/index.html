<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>PDF</title>
  </head>
  <body>
    <p>
      <button type="button" id="btn">Download PDF</button>
      <button type="button" id="btn-sales">Sales</button>
    </p>
    <script>
      async function downloadPdf(url, filename) {
        const res = await fetch(url);
        if (!res.ok) return;
        const blob = await res.blob();
        const href = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = href;
        a.download = filename;
        a.click();
        URL.revokeObjectURL(href);
      }
      document.getElementById('btn').addEventListener('click', () => {
        downloadPdf('/api/pdf', 'document.pdf');
      });
      document.getElementById('btn-sales').addEventListener('click', () => {
        downloadPdf('/api/pdf-sales', 'sales-order.pdf');
      });
    </script>
  </body>
</html>
